<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>시흥시 역사 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
        }
        
        /* 토스 스타일 피드백 애니메이션 */
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        
        .icon-correct {
            display: inline-block;
            animation: bounceIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .icon-wrong {
            display: inline-block;
            animation: shake 0.4s ease;
        }

        /* 바텀시트 슬라이드 애니메이션 */
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.35s cubic-bezier(0.1, 1, 0.1, 1);
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        .overlay {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* 커스텀 스크롤바 바 */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #e5e8eb;
            border-radius: 4px;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-3 sm:p-4 my-auto">

    <!-- 메인 컨테이너 (고정 높이 대신 min-h 및 flex-1 기반 반응형 처리) -->
    <div class="w-full max-w-[420px] min-h-[580px] max-h-[92vh] bg-white rounded-[24px] sm:rounded-[28px] shadow-xl relative overflow-hidden flex flex-col justify-between p-5 sm:p-6 my-auto">
        
        <!-- 1. 카테고리 선택 화면 -->
        <div id="category-screen" class="flex flex-col h-full justify-between py-1">
            <div class="flex-1 overflow-y-auto pr-0.5 custom-scroll">
                <div class="flex items-center gap-2 mb-2.5">
                    <span class="bg-[#e8f3ff] text-[#3182f6] text-xs font-bold px-2.5 py-1 rounded-md">시흥스탬프</span>
                    <span class="text-xs sm:text-sm font-semibold text-gray-500">우리 동네 역사 퀴즈</span>
                </div>
                <h1 class="text-xl sm:text-2xl font-extrabold text-gray-900 leading-snug mb-1.5">
                    알고 싶은 역사를<br/>선택해 주세요
                </h1>
                <p class="text-xs sm:text-sm text-gray-500 mb-4">원하는 주제를 눌러 2문제를 풀어보세요.</p>

                <!-- 카테고리 목록 -->
                <div class="grid grid-cols-1 gap-2.5">
                    <button onclick="selectCategory(0)" class="w-full p-3.5 sm:p-4 rounded-[18px] bg-[#f9fafb] border border-[#e5e8eb] hover:border-[#3182f6] active:bg-[#f0f7ff] transition-all flex items-center justify-between text-left group">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl sm:text-3xl p-2 bg-white rounded-xl shadow-sm">📖</span>
                            <div>
                                <div class="font-bold text-gray-900 text-sm sm:text-base group-hover:text-[#3182f6] transition-colors">동네 설화</div>
                                <div class="text-[11px] sm:text-xs text-gray-400 mt-0.5">옥귀도, 생금집 이야기</div>
                            </div>
                        </div>
                        <span class="text-gray-300 group-hover:text-[#3182f6] transition-colors font-bold text-base sm:text-lg">➔</span>
                    </button>

                    <button onclick="selectCategory(1)" class="w-full p-3.5 sm:p-4 rounded-[18px] bg-[#f9fafb] border border-[#e5e8eb] hover:border-[#3182f6] active:bg-[#f0f7ff] transition-all flex items-center justify-between text-left group">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl sm:text-3xl p-2 bg-white rounded-xl shadow-sm">📍</span>
                            <div>
                                <div class="font-bold text-gray-900 text-sm sm:text-base group-hover:text-[#3182f6] transition-colors">지명 유래</div>
                                <div class="text-[11px] sm:text-xs text-gray-400 mt-0.5">오이도, 정왕산의 비밀</div>
                            </div>
                        </div>
                        <span class="text-gray-300 group-hover:text-[#3182f6] transition-colors font-bold text-base sm:text-lg">➔</span>
                    </button>

                    <button onclick="selectCategory(2)" class="w-full p-3.5 sm:p-4 rounded-[18px] bg-[#f9fafb] border border-[#e5e8eb] hover:border-[#3182f6] active:bg-[#f0f7ff] transition-all flex items-center justify-between text-left group">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl sm:text-3xl p-2 bg-white rounded-xl shadow-sm">👤</span>
                            <div>
                                <div class="font-bold text-gray-900 text-sm sm:text-base group-hover:text-[#3182f6] transition-colors">역사 인물</div>
                                <div class="text-[11px] sm:text-xs text-gray-400 mt-0.5">제정구, 최긍렬 선생님</div>
                            </div>
                        </div>
                        <span class="text-gray-300 group-hover:text-[#3182f6] transition-colors font-bold text-base sm:text-lg">➔</span>
                    </button>

                    <button onclick="selectCategory(3)" class="w-full p-3.5 sm:p-4 rounded-[18px] bg-[#f9fafb] border border-[#e5e8eb] hover:border-[#3182f6] active:bg-[#f0f7ff] transition-all flex items-center justify-between text-left group">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl sm:text-3xl p-2 bg-white rounded-xl shadow-sm">🏛️</span>
                            <div>
                                <div class="font-bold text-gray-900 text-sm sm:text-base group-hover:text-[#3182f6] transition-colors">문화유산</div>
                                <div class="text-[11px] sm:text-xs text-gray-400 mt-0.5">진덕사 의궤, 영응대군 묘</div>
                            </div>
                        </div>
                        <span class="text-gray-300 group-hover:text-[#3182f6] transition-colors font-bold text-base sm:text-lg">➔</span>
                    </button>
                </div>
            </div>

            <div class="text-center text-[11px] text-gray-400 pt-3 border-t border-gray-100 mt-2">
                시흥시 자원봉사 역사 스탬프 챌린지
            </div>
        </div>

        <!-- 2. 퀴즈 진행 화면 -->
        <div id="quiz-screen" class="hidden flex-col h-full justify-between">
            <!-- 상단 상태바 & 질문/보기 영역 -->
            <div class="flex-1 flex flex-col justify-between overflow-y-auto custom-scroll pr-0.5">
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <button onclick="goToCategoryScreen()" class="text-xs font-semibold text-gray-400 hover:text-gray-600 flex items-center gap-1">
                            ◀ 주제 변경
                        </button>
                        <span id="step-indicator" class="text-xs font-bold text-[#3182f6] bg-[#f2f4f6] px-2.5 py-1 rounded-full">1 / 2</span>
                    </div>

                    <div id="question-category" class="text-xs font-bold text-gray-400 mb-1">📖 동네 설화</div>
                    <h2 id="question-text" class="text-base sm:text-lg font-bold text-gray-900 leading-snug mb-4">문제를 불러오는 중...</h2>
                </div>

                <!-- 보기 목록 (모바일 터치 최적화) -->
                <div id="options-list" class="flex flex-col gap-2 my-auto py-1">
                    <!-- Dynamic Buttons -->
                </div>
            </div>
        </div>

        <!-- 3. 최종 결과 화면 -->
        <div id="final-screen" class="hidden flex-col items-center justify-between h-full text-center py-2">
            <div class="flex flex-col items-center my-auto w-full py-4">
                <div id="final-badge" class="text-5xl sm:text-6xl mb-3">🏆</div>
                <h2 id="final-title" class="text-xl sm:text-2xl font-extrabold text-gray-900 mb-1.5">퀴즈 완료!</h2>
                <div id="final-score" class="text-base sm:text-lg font-bold text-[#3182f6] mb-5">총 2문제 중 2개 정답</div>
                <div id="final-desc" class="text-xs sm:text-sm text-gray-600 leading-relaxed bg-[#f9fafb] p-4 sm:p-5 rounded-[18px] w-full border border-gray-100">
                    시흥의 역사를 완벽하게 알고 계시네요!
                </div>
            </div>

            <button onclick="goToCategoryScreen()" class="w-full bg-[#3182f6] hover:bg-[#1b64da] active:scale-[0.98] text-white font-bold py-3.5 sm:py-4 rounded-[16px] text-sm sm:text-base transition-all shadow-md">
                다른 주제 도전하기 🔄
            </button>
        </div>

        <!-- 토스 스타일 바텀시트 & 오버레이 -->
        <div id="overlay" class="overlay absolute inset-0 bg-black/40 z-10"></div>

        <div id="bottom-sheet" class="bottom-sheet absolute bottom-0 left-0 right-0 bg-white rounded-t-[24px] sm:rounded-t-[28px] p-5 sm:p-6 shadow-2xl z-20 max-h-[80%] overflow-y-auto">
            <div id="sheet-icon" class="text-3xl sm:text-4xl mb-1.5">⭕</div>
            <h3 id="sheet-title" class="text-lg sm:text-xl font-bold mb-1.5">정답입니다!</h3>
            <p id="sheet-desc" class="text-xs sm:text-sm text-gray-600 leading-relaxed mb-5">해설이 들어갑니다.</p>
            <button id="sheet-next-btn" onclick="handleNextStep()" class="w-full bg-[#3182f6] hover:bg-[#1b64da] active:scale-[0.98] text-white font-bold py-3.5 rounded-[14px] text-sm sm:text-base transition-all">
                다음 문제 (2/2) ➔
            </button>
        </div>

    </div>

    <script>
        // 4가지 카테고리 데이터 (각 2문제씩)
        const categoriesData = [
            {
                name: "📖 동네 설화",
                questions: [
                    {
                        q: "오이도의 옛 이름인 '옥귀도' 설화에서 어부가 조난당한 임금에게 바친 것은?",
                        options: [
                            "1. 옥(玉)으로 만든 그릇에 담긴 시원한 물",
                            "2. 서해안에서 바로 잡은 신선한 횟감",
                            "3. 섬에서 자라난 신비한 황금 열매",
                            "4. 임금의 목숨을 구한 튼튼한 뗏목"
                        ],
                        answer: 0,
                        explanation: "배가 표류하여 목이 마르던 임금에게 어부가 귀한 옥그릇에 물을 떠다 바치자 감격하여 '옥귀도(玉貴島)'라 부르기 시작했다고 합니다."
                    },
                    {
                        q: "시흥 죽율동 '생금집' 전설에서 주인공 김창관이 옥구도 우물가에서 발견한 신비한 동물은?",
                        options: [
                            "1. 깃털 하나가 금으로 변하는 샛노란 닭",
                            "2. 보물을 찾아주는 영험한 흰 학",
                            "3. 황금알을 낳는 신비한 서해안 거북이",
                            "4. 소원을 들어주는 황금빛 여우"
                        ],
                        answer: 0,
                        explanation: "샛노란 닭의 깃털이 금으로 변해 큰 부자가 되었고 기와집을 지었는데, 이 집이 바로 시흥시 향토유적 제7호 '생금집'입니다."
                    }
                ]
            },
            {
                name: "📍 지명 유래",
                questions: [
                    {
                        q: "오이도의 원래 한자 표기인 '烏耳島(오이도)'에 얽힌 역사적 진실은?",
                        options: [
                            "1. 진짜로 까마귀가 많아 붙여진 이름이다.",
                            "2. '옷귀' 등 고유어 지명을 한자로 음차한 것이다.",
                            "3. 일제강점기에 일본인이 만든 이름이다.",
                            "4. 섬의 생김새가 까마귀 귀 모양과 똑같다."
                        ],
                        answer: 1,
                        explanation: "'까마귀 귀'는 후대에 한자로 끼워 맞춘 것이며, 원래는 '오질애'·'옷귀' 등 고유어를 한자로 옮기는 과정에서 정착된 이름입니다."
                    },
                    {
                        q: "시흥시 정왕동의 모태가 된 '정왕산(正往山)' 지명의 뜻은?",
                        options: [
                            "1. 정이 많고 왕성한 기운이 서린 산",
                            "2. 올바른(正) 공직자들이 왕래(往)하던 산",
                            "3. 정씨와 왕씨 성을 가진 사람들이 개척한 산",
                            "4. 왕이 정사를 돌보며 휴식하던 산"
                        ],
                        answer: 1,
                        explanation: "조정에서 파견된 공직자들이 군사 시설인 봉화대로 가기 위해 이 산을 왕래할 때 '올바른 관리들이 다니는 곳'이라는 뜻에서 붙여졌습니다."
                    }
                ]
            },
            {
                name: "👤 역사 인물",
                questions: [
                    {
                        q: "청계천 판자촌 야학 활동을 시작으로 시흥 신천동에 '복음자리' 마을을 건설하는 등 철거민들의 정착을 도운 인물은?",
                        options: [
                            "1. 제정구",
                            "2. 최긍렬",
                            "3. 정약용",
                            "4. 한용운"
                        ],
                        answer: 0,
                        explanation: "제정구 선생님은 양평동, 시흥동, 목동 등 판자촌 철거민들의 집단 이주를 도와 '복음자리', '한독마을', '목화마을'을 건설하였습니다."
                    },
                    {
                        q: "3.1 운동에 참여했다가 퇴학당한 후, 농촌 계몽과 교육을 위해 1921년 시흥군에 '군자학원'을 설립한 인물은?",
                        options: [
                            "1. 제정구",
                            "2. 최긍렬",
                            "3. 안창호",
                            "4. 주시경"
                        ],
                        answer: 1,
                        explanation: "최긍렬 선생은 암울한 상황을 극복하고자 교육에 뜻을 두고 군자학원을 세웠으며, 오늘날 군자중학교의 모태가 되는 군자고등공민학교를 세우기도 했습니다."
                    }
                ]
            },
            {
                name: "🏛️ 문화유산",
                questions: [
                    {
                        q: "시흥시 진덕사에 소장되어 있으며, 물과 땅에서 죽은 고혼들을 달래기 위한 '수륙재'의 의식을 모은 불교 의례서는?",
                        options: [
                            "1. 법계성범수륙승회수재의궤",
                            "2. 조선왕조실록",
                            "3. 명황계감",
                            "4. 동국여지승람"
                        ],
                        answer: 0,
                        explanation: "'법계성범수륙승회수재의궤'는 물과 땅의 고혼들을 달래는 수륙재의 기원과 절차 등을 모은 불교 의례서로 2017년에 지정되었습니다."
                    },
                    {
                        q: "세종대왕의 8남이며 음률에 조예가 깊고 세종의 각별한 사랑을 받았던 왕자의 묘가 위치한 곳은?",
                        options: [
                            "1. 영응대군 (군자동)",
                            "2. 양녕대군",
                            "3. 효령대군",
                            "4. 수양대군"
                        ],
                        answer: 0,
                        explanation: "세종의 8남 영응대군의 묘 및 신도비가 군자동에 있으며, 세종과 세조가 끔찍이 아꼈던 왕자로 잘 알려져 있습니다."
                    }
                ]
            }
        ];

        let currentCategoryIdx = 0;
        let currentStage = 0;
        let score = 0;
        let activeQuestions = [];

        function goToCategoryScreen() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('flex');
            document.getElementById('final-screen').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('flex');
            
            document.getElementById('category-screen').classList.remove('hidden');
            document.getElementById('category-screen').classList.add('flex');
        }

        function selectCategory(categoryIdx) {
            currentCategoryIdx = categoryIdx;
            currentStage = 0;
            score = 0;
            activeQuestions = categoriesData[categoryIdx].questions;

            document.getElementById('category-screen').classList.add('hidden');
            document.getElementById('category-screen').classList.remove('flex');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('flex');

            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            const quiz = activeQuestions[currentStage];
            const categoryName = categoriesData[currentCategoryIdx].name;

            document.getElementById('step-indicator').innerText = `${currentStage + 1} / 2`;
            document.getElementById('question-category').innerText = `${categoryName} (${currentStage + 1}/2)`;
            document.getElementById('question-text').innerText = quiz.q;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            quiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'w-full p-3 sm:p-3.5 rounded-[14px] bg-[#f9fafb] border border-[#e5e8eb] active:bg-[#e5e8eb] active:scale-[0.98] transition-all text-left text-xs sm:text-sm font-medium text-gray-800 leading-snug';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const quiz = activeQuestions[currentStage];
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');
            const sheetNextBtn = document.getElementById('sheet-next-btn');

            if (selectedIndex === quiz.answer) {
                score++;
                sheetIcon.className = 'text-3xl sm:text-4xl mb-1.5 icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'text-lg sm:text-xl font-bold mb-1.5 text-[#2480f6]';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'text-3xl sm:text-4xl mb-1.5 icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'text-lg sm:text-xl font-bold mb-1.5 text-[#f04452]';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            sheetDesc.innerText = quiz.explanation;

            if (currentStage === 0) {
                sheetNextBtn.innerText = "다음 문제 (2/2) ➔";
            } else {
                sheetNextBtn.innerText = "최종 결과 보기 🏆";
            }

            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        function handleNextStep() {
            currentStage++;
            if (currentStage < activeQuestions.length) {
                renderQuiz();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('flex');

            const finalScreen = document.getElementById('final-screen');
            finalScreen.classList.remove('hidden');
            finalScreen.classList.add('flex');

            const badge = document.getElementById('final-badge');
            const title = document.getElementById('final-title');
            const scoreEl = document.getElementById('final-score');
            const desc = document.getElementById('final-desc');
            const categoryName = categoriesData[currentCategoryIdx].name;

            scoreEl.innerText = `총 2문제 중 ${score}개 정답!`;

            if (score === 2) {
                badge.innerText = '🎉';
                title.innerText = `완벽해요! [${categoryName}] 마스터!`;
                desc.innerText = `${categoryName} 부문 2문제를 모두 맞히셨습니다. 시흥 역사를 아주 잘 알고 계시네요! 👏`;
            } else if (score === 1) {
                badge.innerText = '👍';
                title.innerText = '훌륭해요! 1문제 정답!';
                desc.innerText = `${categoryName} 부문에서 1문제를 맞히셨군요! 시흥의 역사를 알아가는 좋은 시간이 되었길 바랍니다 😊`;
            } else {
                badge.innerText = '💡';
                title.innerText = '새로운 역사 지식 습득!';
                desc.innerText = `오늘 ${categoryName}에 대해 새로운 유익한 이야기를 알게 되었네요! 참여해 주셔서 감사합니다 👏`;
            }
        }

        // 초기 화면 설정
        window.onload = function() {
            goToCategoryScreen();
        };
    </script>
</body>
</html>
