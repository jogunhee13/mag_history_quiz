<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시흥시 역사 퀵 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 680px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .header-badge {
            background: #e8f3ff;
            color: #3182f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #333d4b;
        }

        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #191f28;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        .question-img-box {
            width: 100%;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #e5e8eb;
            display: none;
        }
        .question-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f9fafb;
            border: 1px solid #e5e8eb;
            border-radius: 14px;
            padding: 13px 16px;
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            color: #333d4b;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option-btn:active {
            background: #e5e8eb;
            transform: scale(0.98);
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            z-index: 10;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .icon-correct {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounceIn 0.4s ease;
        }
        .icon-wrong {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: shake 0.4s ease;
        }

        .sheet-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sheet-title.correct-color { color: #2480f6; }
        .sheet-title.wrong-color { color: #f04452; }

        .sheet-desc {
            font-size: 0.92rem;
            color: #4e5968;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .next-btn {
            background: #3182f6;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:active {
            background: #1b64da;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div>
            <div class="header">
                <span class="header-badge">시흥스탬프</span>
                <span class="header-title">우리 동네 역사 퀴즈</span>
            </div>
        </div>

        <div class="card-body">
            <div id="question-img-box" class="question-img-box">
                <img id="question-img" src="" alt="역사 사진">
            </div>
            <div id="question-text" class="question-text">문제를 불러오는 중...</div>
            <div class="options-list" id="options-list"></div>
        </div>

        <div id="overlay" class="overlay" onclick="loadNextQuiz()"></div>

        <div id="bottom-sheet" class="bottom-sheet">
            <div id="sheet-icon"></div>
            <div id="sheet-title" class="sheet-title"></div>
            <div id="sheet-desc" class="sheet-desc"></div>
            <button class="next-btn" onclick="loadNextQuiz()">다른 문제 풀기 🔄</button>
        </div>
    </div>

    <script>
        // 지명 2개 + 설화 2개 총 4개 문제
        const quizList = [
            // [지명 1]
            {
                id: 1,
                q: "[지명 유래] 오이도의 원래 한자 표기인 '烏耳島(오이도)'에 얽힌 역사적 진실은?",
                img: "",
                options: [
                    "1. 진짜로 까마귀가 많아 붙여진 이름이다.",
                    "2. '옷귀' 등 고유어 지명을 한자로 음차한 것이다.",
                    "3. 일제강점기에 일본인이 만든 이름이다.",
                    "4. 섬의 생김새가 까마귀 귀 모양과 똑같다."
                ],
                answer: 1,
                explanation: "'까마귀 귀'는 후대에 한자로 끼워 맞춘 것이며, 원래는 '오질애'·'옷귀' 등 고유어를 한자로 옮기는 과정에서 정착된 이름입니다."
            },
            // [지명 2]
            {
                id: 2,
                q: "[지명 유래] 시흥시 정왕동의 모태가 된 '정왕산(正往山)' 지명의 뜻은?",
                img: "",
                options: [
                    "1. 정이 많고 왕성한 기운이 서린 산",
                    "2. 올바른(正) 공직자들이 왕래(往)하던 산",
                    "3. 정씨와 왕씨 성을 가진 사람들이 개척한 산",
                    "4. 왕이 정사를 돌보며 휴식하던 산"
                ],
                answer: 1,
                explanation: "조정에서 파견된 공직자들이 군사 시설인 봉화대로 가기 위해 이 산을 왕래할 때 '올바른 관리들이 다니는 곳'이라는 뜻에서 붙여졌습니다."
            },
            // [설화 1]
            {
                id: 3,
                q: "[동네 설화] 오이도의 옛 이름인 '옥귀도' 설화에서 어부가 조난당한 임금에게 바친 것은?",
                img: "",
                options: [
                    "1. 옥(玉)으로 만든 그릇에 담긴 시원한 물",
                    "2. 서해안에서 바로 잡은 신선한 횟감",
                    "3. 섬에서 자라난 신비한 황금 열매",
                    "4. 임금의 목숨을 구한 튼튼한 뗏목"
                ],
                answer: 0,
                explanation: "배가 표류하여 목이 마르던 임금에게 어부가 귀한 옥그릇에 물을 떠다 바치자 감격하여 '옥귀도(玉貴島)'라 부르기 시작했다고 합니다."
            },
            // [설화 2]
            {
                id: 4,
                q: "[동네 설화] 시흥 죽율동 '생금집' 전설에서 주인공 김창관이 옥구도 우물가에서 발견한 동물은?",
                img: "",
                options: [
                    "1. 깃털 하나가 금으로 변하는 샛노란 닭",
                    "2. 보물을 찾아주는 영험한 흰 학",
                    "3. 황금알을 낳는 신비한 서해안 거북이",
                    "4. 소원을 들어주는 황금빛 여우"
                ],
                answer: 0,
                explanation: "샛노란 닭의 깃털이 금으로 변해 큰 부자가 되었고 기와집을 지었는데, 이 집이 바로 시흥시 향토유적 제7호 '생금집'입니다."
            }
        ];

        let lastQuizId = null; // 직전에 출제된 문제 ID 기록
        let currentQuiz = null;

        function loadNextQuiz() {
            // 바텀시트 및 오버레이 닫기
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            // 직전 문제를 제외한 나머지 문제 후보들 추출
            const availableQuizzes = quizList.filter(quiz => quiz.id !== lastQuizId);

            // 남아있는 후보 중에서 무작위 선택
            const randomIndex = Math.floor(Math.random() * availableQuizzes.length);
            currentQuiz = availableQuizzes[randomIndex];

            // 현재 문제 ID를 직전 문제 기록으로 업데이트
            lastQuizId = currentQuiz.id;

            // 화면에 문제 바인딩
            document.getElementById('question-text').innerText = currentQuiz.q;

            const imgBox = document.getElementById('question-img-box');
            const imgEl = document.getElementById('question-img');
            if (currentQuiz.img && currentQuiz.img.trim() !== "") {
                imgEl.src = currentQuiz.img;
                imgBox.style.display = "block";
            } else {
                imgBox.style.display = "none";
            }

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            currentQuiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');

            if (selectedIndex === currentQuiz.answer) {
                sheetIcon.className = 'icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'sheet-title correct-color';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'sheet-title wrong-color';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            sheetDesc.innerText = currentQuiz.explanation;

            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        window.onload = function() {
            loadNextQuiz();
        };
    </script>
</body>
</html>
