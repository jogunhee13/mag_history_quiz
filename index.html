<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시흥시 역사 퀵 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 680px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .header-badge {
            background: #e8f3ff;
            color: #3182f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #333d4b;
        }

        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #191f28;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        .question-img-box {
            width: 100%;
            height: 150px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #e5e8eb;
            display: none;
        }
        .question-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f9fafb;
            border: 1px solid #e5e8eb;
            border-radius: 14px;
            padding: 13px 16px;
            font-size: 0.92rem;
            font-weight: 500;
            text-align: left;
            color: #333d4b;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option-btn:active {
            background: #e5e8eb;
            transform: scale(0.98);
        }

        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            z-index: 10;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .icon-correct {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounceIn 0.4s ease;
        }
        .icon-wrong {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: shake 0.4s ease;
        }

        .sheet-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sheet-title.correct-color { color: #2480f6; }
        .sheet-title.wrong-color { color: #f04452; }

        .sheet-desc {
            font-size: 0.92rem;
            color: #4e5968;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .next-btn {
            background: #3182f6;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:active {
            background: #1b64da;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div>
            <div class="header">
                <span class="header-badge">시흥스탬프</span>
                <span class="header-title">우리 동네 역사 퀴즈</span>
            </div>
        </div>

        <div class="card-body">
            <div id="question-img-box" class="question-img-box">
                <img id="question-img" src="" alt="역사 사진">
            </div>
            <div id="question-text" class="question-text">문제를 불러오는 중...</div>
            <div class="options-list" id="options-list"></div>
        </div>

        <div id="overlay" class="overlay" onclick="loadNextQuiz()"></div>

        <div id="bottom-sheet" class="bottom-sheet">
            <div id="sheet-icon"></div>
            <div id="sheet-title" class="sheet-title"></div>
            <div id="sheet-desc" class="sheet-desc"></div>
            <button class="next-btn" onclick="loadNextQuiz()">다른 문제 풀기 🔄</button>
        </div>
    </div>

    <script>
        const quizList = [
            {
                q: "1. 오이도의 원래 한자 표기인 '烏耳島(오이도)'의 숨겨진 역사적 진실은?",
                img: "",
                options: [
                    "1. 까마귀가 많아 붙은 이름이다.",
                    "2. 고유어 지명 '옷귀' 등을 한자로 음차한 것이다.",
                    "3. 일제강점기에 바뀐 이름이다.",
                    "4. 섬 모양이 까마귀 귀를 닮았다."
                ],
                answer: 1,
                explanation: "'까마귀 귀'는 후대에 한자로 끼워 맞춘 것이며, 원래는 '오질애'·'옷귀' 등 고유어를 한자로 옮기며 정착된 지명입니다."
            },
            {
                q: "2. 오이도의 옛 이름인 '옥귀도' 설화에서 어부가 조난당한 임금에게 바친 것은?",
                img: "",
                options: [
                    "1. 옥으로 만든 그릇에 담긴 물",
                    "2. 신비한 황금 열매",
                    "3. 싱싱한 서해안 조개",
                    "4. 임금의 목숨을 구한 뗏목"
                ],
                answer: 0,
                explanation: "어부가 귀한 옥그릇에 물을 바치자 임금이 감격하여 섬 이름을 '옥귀도(玉貴島)'라 부르기 시작했다는 전설이 있습니다."
            },
            {
                q: "3. 일제강점기 오이도 남쪽 '똥섬(덕섬)'을 잘라내려 할 때 일어난 기이한 현상은?",
                img: "",
                options: [
                    "1. 자른 틈새에서 붉은 피가 흘러나왔다.",
                    "2. 섬 전체가 바다 밑으로 침몰했다.",
                    "3. 수많은 까마귀가 날아와 공사를 방해했다.",
                    "4. 하루 만에 잘려 나간 땅이 다시 붙었다."
                ],
                answer: 0,
                explanation: "두 섬의 연결을 끊으려고 잘라내자 틈새에서 피가 흘러나와 영험함에 두려워한 일본인들이 공사를 멈췄다는 전설입니다."
            },
            {
                q: "4. 정왕동의 모태가 된 '정왕산(正往山)' 봉화대의 이름 유래는?",
                img: "",
                options: [
                    "1. 왕이 정사를 돌보며 쉬어가던 곳",
                    "2. 올바른(正) 공직자들이 왕래(往)하는 곳",
                    "3. 정씨와 왕씨가 처음 마을을 일군 곳",
                    "4. 정기가 바르고 왕성한 산"
                ],
                answer: 1,
                explanation: "조정에서 파견된 공직자들이 봉화대로 가기 위해 이 산을 자주 왕래할 때 '올바른 자들이 왕래한다'는 뜻에서 붙여진 이름입니다."
            },
            {
                q: "5. 죽율동 '생금집' 전설에서 주인공 김창관이 옥구도 우물가에서 가져온 동물은?",
                img: "",
                options: [
                    "1. 깃털이 금으로 변하는 샛노란 닭",
                    "2. 황금알을 낳는 신비한 거위",
                    "3. 말을 듣는 황금 여우",
                    "4. 보물을 찾아주는 하얀 개"
                ],
                answer: 0,
                explanation: "샛노란 닭의 깃털이 금으로 변해 부자가 되어 지은 기와집이 '생금집'이며, 현재 시흥시 향토유적 제7호입니다."
            },
            {
                q: "6. '생금집' 전설에서 소문을 듣고 황금닭을 훔쳐 달아난 딸에게 일어난 일은?",
                img: "",
                options: [
                    "1. 닭이 돌멩이로 변해버렸다.",
                    "2. 닭이 하늘로 날아가 버렸다.",
                    "3. 닭이 황금을 더 이상 낳지 않았다.",
                    "4. 닭이 까마귀로 변했다."
                ],
                answer: 0,
                explanation: "탐욕을 부린 딸이 닭을 훔쳐가자 황금닭이 돌멩이로 변해버렸다는 권선징악의 교훈이 담겨 있습니다."
            },
            {
                q: "7. 시흥 군자봉 정상에서 신라 경순왕을 성황신으로 모시며 매년 열리는 천년 역사의 축제는?",
                img: "",
                options: [
                    "1. 군자봉성황제",
                    "2. 오이도바다축제",
                    "3. 정왕산봉화제",
                    "4. 생금집문화제"
                ],
                answer: 0,
                explanation: "군자봉 정상(향토유적 제14호)에서는 경순왕과 안씨 부인을 모시는 '군자봉성황제'가 매년 음력 10월 3일에 열립니다."
            },
            {
                q: "8. 임진왜란 당시 조남리 고개에서 여인이 조선군 기습을 돕기 위해 외친 암호는?",
                img: "",
                options: [
                    "1. 다자귀 (모두 잠들어라)",
                    "2. 더자귀 (계속 지켜라)",
                    "3. 까마귀 (적군이 왔다)",
                    "4. 생금지 (돌격하라)"
                ],
                answer: 0,
                explanation: "'다자귀'를 외쳐 왜군을 안심시킨 뒤 조선군이 기습하여 승리했고, 피가 내를 이루어 '피흘리고개'가 되었습니다."
            },
            {
                q: "9. 조선 전기 영의정을 지낸 '하연'이 유언으로 시흥 신천동 묘소 주변에 심게 한 나무는?",
                img: "",
                options: [
                    "1. 회나무",
                    "2. 소나무",
                    "3. 느티나무",
                    "4. 은행나무"
                ],
                answer: 0,
                explanation: "후손들이 회나무를 팔아버리자 하연의 혼이 나타나는 기이한 일이 일어났고, 나무를 다시 심어 위로했다는 설화가 전해집니다."
            },
            {
                q: "10. 원래 배를 타고 들어가던 섬이었던 오이도가 육지와 연결된 결정적 계기는?",
                img: "",
                options: [
                    "1. 1922년 일제강점기 염전 개발과 제방 공사",
                    "2. 조선시대 세종대왕의 다리 건설",
                    "3. 시화공단 조성 사업",
                    "4. 지하철 4호선 오이도역 개통"
                ],
                answer: 0,
                explanation: "오이도는 원래 섬이었으나 1922년 일제강점기 염전 개발 및 제방 공사로 인해 육지화되었습니다."
            }
        ];

        // 10문제를 중복 없이 섞어주는 스마트 셔플 로직
        let shuffledIndexes = [];
        let currentIndex = 0;

        function initQuiz() {
            // 0~9 번호를 무작위로 섞기 (피셔-예이츠 셔플)
            shuffledIndexes = Array.from({length: quizList.length}, (_, i) => i);
            for (let i = shuffledIndexes.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledIndexes[i], shuffledIndexes[j]] = [shuffledIndexes[j], shuffledIndexes[i]];
            }
            currentIndex = 0;
        }

        function loadNextQuiz() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            // 10문제를 다 풀었으면 다시 섞어서 순환
            if (currentIndex >= shuffledIndexes.length) {
                initQuiz();
            }

            const targetIndex = shuffledIndexes[currentIndex];
            currentQuiz = quizList[targetIndex];
            currentIndex++; // 다음 문제를 위해 인덱스 증가

            document.getElementById('question-text').innerText = currentQuiz.q;

            const imgBox = document.getElementById('question-img-box');
            const imgEl = document.getElementById('question-img');
            if (currentQuiz.img && currentQuiz.img.trim() !== "") {
                imgEl.src = currentQuiz.img;
                imgBox.style.display = "block";
            } else {
                imgBox.style.display = "none";
            }

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            currentQuiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');

            if (selectedIndex === currentQuiz.answer) {
                sheetIcon.className = 'icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'sheet-title correct-color';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'sheet-title wrong-color';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            sheetDesc.innerText = currentQuiz.explanation;

            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        window.onload = function() {
            initQuiz();
            loadNextQuiz();
        };
    </script>
</body>
</html>
