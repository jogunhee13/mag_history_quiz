<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시흥시 역사 퀵 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden; /* 스크롤 거의 없도록 고정 */
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 680px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        /* 상단 헤더 */
        .header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
        }
        .header-badge {
            background: #e8f3ff;
            color: #3182f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #333d4b;
        }

        /* 문제 카드 영역 */
        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #191f28;
            line-height: 1.5;
            margin-bottom: 16px;
        }
        
        /* 문제 사진 (있을 때만 표시) */
        .question-img-box {
            width: 100%;
            height: 160px;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
            background: #e5e8eb;
            display: none;
        }
        .question-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 보기 버튼 리스트 */
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f9fafb;
            border: 1px solid #e5e8eb;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            color: #333d4b;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option-btn:active {
            background: #e5e8eb;
            transform: scale(0.98);
        }

        /* 토스 스타일 바텀시트 */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            z-index: 10;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        /* 애니메이션 효과 */
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .icon-correct {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounceIn 0.4s ease;
        }
        .icon-wrong {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: shake 0.4s ease;
        }

        .sheet-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sheet-title.correct-color { color: #2480f6; }
        .sheet-title.wrong-color { color: #f04452; }

        .sheet-desc {
            font-size: 0.92rem;
            color: #4e5968;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .next-btn {
            background: #3182f6;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:active {
            background: #1b64da;
        }

        /* 배경 어둡게 하는 오버레이 */
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 -->
        <div>
            <div class="header">
                <span class="header-badge">시흥스탬프</span>
                <span class="header-title">우리 동네 역사 퀴즈</span>
            </div>
        </div>

        <!-- 본문 (문제 영역) -->
        <div class="card-body">
            <div id="question-img-box" class="question-img-box">
                <img id="question-img" src="" alt="역사 사진">
            </div>
            <div id="question-text" class="question-text">문제를 불러오는 중...</div>
            <div class="options-list" id="options-list">
                <!-- 보기가 동적으로 들어갑니다 -->
            </div>
        </div>

        <!-- 배경 어둠막 -->
        <div id="overlay" class="overlay" onclick="loadRandomQuiz()"></div>

        <!-- 바텀시트 (토스 스타일 결과 창) -->
        <div id="bottom-sheet" class="bottom-sheet">
            <div id="sheet-icon"></div>
            <div id="sheet-title" class="sheet-title"></div>
            <div id="sheet-desc" class="sheet-desc"></div>
            <button class="next-btn" onclick="loadRandomQuiz()">다른 문제 풀기 🔄</button>
        </div>
    </div>

    <script>
        // 시흥시 역사 퀴즈 데이터베이스 (사진이 필요한 곳은 img에 주소 추가 가능)
        const quizList = [
            {
                q: "오이도의 원래 한자 표기인 '烏耳島'의 숨겨진 진실은 무엇일까요?",
                img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=600&q=80", // 예시 풍경 사진
                options: [
                    "1. 조선시대부터 까마귀가 많았다.",
                    "2. '옷귀' 등 우리말 지명을 한자로 음차한 것이다.",
                    "3. 일본인들이 관광지로 개발하며 지었다.",
                    "4. 섬의 생김새가 까마귀를 닮았다."
                ],
                answer: 1,
                explanation: "까마귀 귀라는 표기는 후대에 끼워 맞춰진 것이며, 원래는 '오질애'·'옷귀' 등의 우리말 지명에서 유래했습니다."
            },
            {
                q: "오이도의 옛 이름인 '옥귀도' 설화에서 임금에게 무엇을 바쳤을까요?",
                img: "", // 사진 없는 문제 테스트
                options: [
                    "1. 옥으로 만든 그릇에 담긴 물",
                    "2. 황금으로 만든 보물 상자",
                    "3. 싱싱한 서해안 조개구이",
                    "4. 궁중에서 가져온 최고급 차"
                ],
                answer: 0,
                explanation: "조난당한 임금에게 어부가 옥그릇에 물을 떠다 바쳐 귀하게 여겼다는 설화에서 유래했습니다."
            },
            {
                q: "시흥시 정왕동의 모태가 된 '정왕산' 봉화대의 유래와 가장 가까운 것은?",
                img: "",
                options: [
                    "1. 정씨 성을 가진 왕이 살던 곳",
                    "2. 왕이 정사를 돌보며 휴식하던 곳",
                    "3. 올바른 공직자들이 왕래하던 길목",
                    "4. 붉은 정기가 서려 있는 명산"
                ],
                answer: 2,
                explanation: "공직자들이 봉화대로 가기 위해 이 산을 왕래할 때 '올바른 공직자들이 왕래한다'는 뜻에서 유래했습니다."
            },
            {
                q: "시흥 죽율동 '생금집' 전설에서 옥구도 우물가에서 발견한 신비한 동물은?",
                img: "",
                options: [
                    "1. 깃털 하나가 금으로 변하는 샛노란 닭",
                    "2. 황금빛 털을 가진 신비한 여우",
                    "3. 말을 하는 영리한 하얀 학",
                    "4. 부를 가져다주는 황금 거북이"
                ],
                answer: 0,
                explanation: "옥구도에서 발견한 신비한 황금닭이 낳아준 황금 덕분에 부자가 되었다는 향토 유적 설화입니다."
            },
            {
                q: "임진왜란 당시 조남리 고개에서 여인의 기지로 왜군을 물리친 전투의 이름은?",
                img: "",
                options: [
                    "1. 피흘리고개 전투",
                    "2. 여우고개 대첩",
                    "3. 자귀고개 승전",
                    "4. 호랑이골 방어전"
                ],
                answer: 0,
                explanation: "아들 이름인 '다자귀'를 암호로 삼아 왜군을 방심하게 만들고 기습하여 흘린 피가 내를 이루어 '피흘리고개'가 되었습니다."
            }
        ];

        let currentQuiz = null;

        function loadRandomQuiz() {
            // 바텀시트 및 오버레이 숨기기
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            // 랜덤 문제 추출
            const randomIndex = Math.floor(Math.random() * quizList.length);
            currentQuiz = quizList[randomIndex];

            // 문제 세팅
            document.getElementById('question-text').innerText = currentQuiz.q;

            // 사진 처리 (있으면 보여주고, 없으면 숨기기)
            const imgBox = document.getElementById('question-img-box');
            const imgEl = document.getElementById('question-img');
            if (currentQuiz.img && currentQuiz.img.trim() !== "") {
                imgEl.src = currentQuiz.img;
                imgBox.style.display = "block";
            } else {
                imgBox.style.display = "none";
            }

            // 보기 버튼 생성
            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            currentQuiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');

            // 결과 판정
            if (selectedIndex === currentQuiz.answer) {
                sheetIcon.className = 'icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'sheet-title correct-color';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'sheet-title wrong-color';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            // 설명 삽입
            sheetDesc.innerText = currentQuiz.explanation;

            // 바텀시트 & 오버레이 슬라이드 업
            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        // 페이지 진입 시 바로 실행
        window.onload = loadRandomQuiz;
    </script>
</body>
</html>
