<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시흥시 역사 퀵 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            min-height: 580px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        /* 상단 헤더 */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-badge {
            background: #e8f3ff;
            color: #3182f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #333d4b;
        }
        .step-indicator {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3182f6;
            background: #f2f4f6;
            padding: 4px 10px;
            border-radius: 12px;
        }

        /* 1. 카테고리 선택 화면 */
        .category-screen {
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: center;
            padding: 10px 0;
        }
        .category-select-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #191f28;
            margin-bottom: 4px;
        }
        .category-select-subtitle {
            font-size: 0.88rem;
            color: #8b95a1;
            margin-bottom: 12px;
        }
        .category-card {
            background: #f9fafb;
            border: 1.5 solid #e5e8eb;
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .category-card:active {
            background: #edf4ff;
            border-color: #3182f6;
            transform: scale(0.98);
        }
        .category-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .category-icon {
            font-size: 1.6rem;
        }
        .category-name {
            font-size: 1rem;
            font-weight: 700;
            color: #333d4b;
        }
        .category-arrow {
            color: #b0b8c1;
            font-size: 1.1rem;
            font-weight: 700;
        }

        /* 2. 퀴즈 화면 */
        .card-body {
            display: none;
            flex-direction: column;
            justify-content: flex-start;
            flex-grow: 1;
        }
        .question-category {
            font-size: 0.85rem;
            font-weight: 700;
            color: #8b95a1;
            margin-bottom: 8px;
        }
        .question-text {
            font-size: 1.08rem;
            font-weight: 700;
            color: #191f28;
            line-height: 1.5;
            margin-bottom: 18px;
            word-break: keep-all;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }
        .option-btn {
            background: #f9fafb;
            border: 1px solid #e5e8eb;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.9rem;
            font-weight: 500;
            text-align: left;
            color: #333d4b;
            cursor: pointer;
            transition: all 0.15s ease;
            line-height: 1.4;
            word-break: keep-all;
        }
        .option-btn:active {
            background: #e5e8eb;
            transform: scale(0.98);
        }

        /* 3. 최종 결과 화면 */
        .final-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            text-align: center;
            padding: 20px 0;
        }
        .final-badge {
            font-size: 3.5rem;
            margin-bottom: 12px;
        }
        .final-title {
            font-size: 1.4rem;
            font-weight: 800;
            color: #191f28;
            margin-bottom: 8px;
            word-break: keep-all;
        }
        .final-score {
            font-size: 1.2rem;
            font-weight: 700;
            color: #3182f6;
            margin-bottom: 18px;
        }
        .final-desc {
            font-size: 0.92rem;
            color: #4e5968;
            line-height: 1.5;
            background: #f9fafb;
            padding: 18px;
            border-radius: 18px;
            width: 100%;
            margin-bottom: 20px;
            word-break: keep-all;
        }

        /* 토스 스타일 바텀시트 */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 28px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            z-index: 10;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .icon-correct {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounceIn 0.4s ease;
        }
        .icon-wrong {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: shake 0.4s ease;
        }

        .sheet-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sheet-title.correct-color { color: #2480f6; }
        .sheet-title.wrong-color { color: #f04452; }

        .sheet-desc {
            font-size: 0.9rem;
            color: #4e5968;
            line-height: 1.5;
            margin-bottom: 20px;
            word-break: keep-all;
        }
        .next-btn {
            background: #3182f6;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 15px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:active {
            background: #1b64da;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 -->
        <div class="header" id="app-header">
            <div class="header-left">
                <span class="header-badge">시흥스탬프</span>
                <span class="header-title">우리 동네 역사 퀴즈</span>
            </div>
            <span class="step-indicator" id="step-indicator" style="display: none;">1 / 2</span>
        </div>

        <!-- 1. 카테고리 선택 화면 -->
        <div class="category-screen" id="category-screen">
            <div>
                <div class="category-select-title">주제를 선택해 주세요</div>
                <div class="category-select-subtitle">원하는 역사 영역을 선택하면 2문제가 시작됩니다</div>
            </div>

            <div class="category-card" onclick="selectCategory(0)">
                <div class="category-info">
                    <span class="category-icon">📖</span>
                    <span class="category-name">동네 설화</span>
                </div>
                <span class="category-arrow">➔</span>
            </div>

            <div class="category-card" onclick="selectCategory(1)">
                <div class="category-info">
                    <span class="category-icon">📍</span>
                    <span class="category-name">지명 유래</span>
                </div>
                <span class="category-arrow">➔</span>
            </div>

            <div class="category-card" onclick="selectCategory(2)">
                <div class="category-info">
                    <span class="category-icon">👤</span>
                    <span class="category-name">역사 인물</span>
                </div>
                <span class="category-arrow">➔</span>
            </div>

            <div class="category-card" onclick="selectCategory(3)">
                <div class="category-info">
                    <span class="category-icon">🏛️</span>
                    <span class="category-name">문화유산</span>
                </div>
                <span class="category-arrow">➔</span>
            </div>
        </div>

        <!-- 2. 문제 진행 화면 -->
        <div class="card-body" id="quiz-screen">
            <div id="question-category" class="question-category">📖 동네 설화</div>
            <div id="question-text" class="question-text">문제를 불러오는 중...</div>
            <div class="options-list" id="options-list"></div>
        </div>

        <!-- 3. 최종 결과 화면 -->
        <div class="final-screen" id="final-screen">
            <div class="final-badge" id="final-badge">🏆</div>
            <div class="final-title" id="final-title">퀴즈 완료!</div>
            <div class="final-score" id="final-score">총 2문제 중 2개 정답</div>
            <div class="final-desc" id="final-desc">시흥의 역사를 잘 알고 계시네요! 멋집니다 👍</div>
            <button class="next-btn" onclick="showCategoryScreen()">다른 주제 도전하기 🔄</button>
        </div>

        <!-- 오버레이 및 바텀시트 -->
        <div id="overlay" class="overlay"></div>

        <div id="bottom-sheet" class="bottom-sheet">
            <div id="sheet-icon"></div>
            <div id="sheet-title" class="sheet-title"></div>
            <div id="sheet-desc" class="sheet-desc"></div>
            <button class="next-btn" id="sheet-next-btn" onclick="handleNextStep()">다음 문제 ➔</button>
        </div>
    </div>

    <script>
        // 4개 카테고리 x 각 2문제 = 총 8문제
        const allCategories = [
            {
                name: "📖 동네 설화",
                questions: [
                    {
                        q: "오이도의 옛 이름인 '옥귀도' 설화에서 어부가 조난당한 임금에게 바친 것은?",
                        options: [
                            "1. 옥(玉)으로 만든 그릇에 담긴 시원한 물",
                            "2. 서해안에서 바로 잡은 신선한 횟감",
                            "3. 섬에서 자라난 신비한 황금 열매",
                            "4. 임금의 목숨을 구한 튼튼한 뗏목"
                        ],
                        answer: 0,
                        explanation: "배가 표류하여 목이 마르던 임금에게 어부가 귀한 옥그릇에 물을 떠다 바치자 감격하여 '옥귀도(玉貴島)'라 부르기 시작했다고 합니다."
                    },
                    {
                        q: "시흥 죽율동 '생금집' 전설에서 주인공 김창관이 옥구도 우물가에서 발견한 신비한 동물은?",
                        options: [
                            "1. 깃털 하나가 금으로 변하는 샛노란 닭",
                            "2. 보물을 찾아주는 영험한 흰 학",
                            "3. 황금알을 낳는 신비한 서해안 거북이",
                            "4. 소원을 들어주는 황금빛 여우"
                        ],
                        answer: 0,
                        explanation: "샛노란 닭의 깃털이 금으로 변해 큰 부자가 되었고 기와집을 지었는데, 이 집이 바로 시흥시 향토유적 제7호 '생금집'입니다."
                    }
                ]
            },
            {
                name: "📍 지명 유래",
                questions: [
                    {
                        q: "오이도의 원래 한자 표기인 '烏耳島(오이도)'에 얽힌 역사적 진실은?",
                        options: [
                            "1. 진짜로 까마귀가 많아 붙여진 이름이다.",
                            "2. '옷귀' 등 고유어 지명을 한자로 음차한 것이다.",
                            "3. 일제강점기에 일본인이 만든 이름이다.",
                            "4. 섬의 생김새가 까마귀 귀 모양과 똑같다."
                        ],
                        answer: 1,
                        explanation: "'까마귀 귀'는 후대에 한자로 끼워 맞춘 것이며, 원래는 '오질애'·'옷귀' 등 고유어를 한자로 옮기는 과정에서 정착된 이름입니다."
                    },
                    {
                        q: "시흥시 정왕동의 모태가 된 '정왕산(正往山)' 지명의 뜻은?",
                        options: [
                            "1. 정이 많고 왕성한 기운이 서린 산",
                            "2. 올바른(正) 공직자들이 왕래(往)하던 산",
                            "3. 정씨와 왕씨 성을 가진 사람들이 개척한 산",
                            "4. 왕이 정사를 돌보며 휴식하던 산"
                        ],
                        answer: 1,
                        explanation: "조정에서 파견된 공직자들이 군사 시설인 봉화대로 가기 위해 이 산을 왕래할 때 '올바른 관리들이 다니는 곳'이라는 뜻에서 붙여졌습니다."
                    }
                ]
            },
            {
                name: "👤 역사 인물",
                questions: [
                    {
                        q: "청계천 판자촌 야학 활동을 시작으로 시흥 신천동에 '복음자리' 마을을 건설하는 등 철거민들의 정착을 도운 인물은?",
                        options: [
                            "1. 제정구",
                            "2. 최긍렬",
                            "3. 정약용",
                            "4. 한용운"
                        ],
                        answer: 0,
                        explanation: "제정구 선생님은 양평동, 시흥동, 목동 등 판자촌 철거민들의 집단 이주를 도와 '복음자리', '한독마을', '목화마을'을 건설하였습니다."
                    },
                    {
                        q: "3.1 운동에 참여했다가 퇴학당한 후, 농촌 계몽과 교육을 위해 1921년 시흥군에 '군자학원'을 설립한 인물은?",
                        options: [
                            "1. 제정구",
                            "2. 최긍렬",
                            "3. 안창호",
                            "4. 주시경"
                        ],
                        answer: 1,
                        explanation: "최긍렬 선생은 암울한 상황을 극복하고자 교육에 뜻을 두고 군자학원을 세웠으며, 오늘날 군자중학교의 모태가 되는 군자고등공민학교를 세우기도 했습니다."
                    }
                ]
            },
            {
                name: "🏛️ 문화유산",
                questions: [
                    {
                        q: "시흥시 대야동 소래산 중턱 병풍바위에 거대한 선으로 새겨져 있으며, 고려시대에 조성된 국가지정 보물은?",
                        options: [
                            "1. 시흥 소래산 마애보살입상",
                            "2. 법계성범수륙승회수재의궤",
                            "3. 북한산 신라 진흥왕 순수비",
                            "4. 석굴암 본존불상"
                        ],
                        answer: 0,
                        explanation: "소래산 병풍바위에 약 14m 높이로 새겨진 고려시대 대형 마애불상으로, 2001년 국가지정 보물로 지정되었습니다."
                    },
                    {
                        q: "세종대왕의 8남이며 음률에 조예가 깊고 세종의 각별한 사랑을 받았던 왕자의 묘가 위치한 곳은?",
                        options: [
                            "1. 영응대군 (군자동)",
                            "2. 양녕대군",
                            "3. 효령대군",
                            "4. 수양대군"
                        ],
                        answer: 0,
                        explanation: "세종의 8남 영응대군의 묘 및 신도비가 군자동에 있으며, 세종과 세조가 끔찍이 아꼈던 왕자로 잘 알려져 있습니다."
                    }
                ]
            }
        ];

        let currentStage = 0;
        let score = 0;
        let activeCategoryName = "";
        let selectedQuizList = [];

        function showCategoryScreen() {
            document.getElementById('category-screen').style.display = 'flex';
            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('final-screen').style.display = 'none';
            document.getElementById('step-indicator').style.display = 'none';
        }

        function selectCategory(categoryIndex) {
            const selectedCategory = allCategories[categoryIndex];
            activeCategoryName = selectedCategory.name;
            selectedQuizList = selectedCategory.questions;

            currentStage = 0;
            score = 0;

            document.getElementById('category-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            document.getElementById('step-indicator').style.display = 'inline-block';

            renderCurrentQuiz();
        }

        function renderCurrentQuiz() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            const quiz = selectedQuizList[currentStage];

            document.getElementById('step-indicator').innerText = (currentStage + 1) + " / 2";
            document.getElementById('question-category').innerText = activeCategoryName + ` (${currentStage + 1}/2)`;
            document.getElementById('question-text').innerText = quiz.q;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            quiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const quiz = selectedQuizList[currentStage];
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');
            const sheetNextBtn = document.getElementById('sheet-next-btn');

            if (selectedIndex === quiz.answer) {
                score++;
                sheetIcon.className = 'icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'sheet-title correct-color';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'sheet-title wrong-color';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            sheetDesc.innerText = quiz.explanation;

            if (currentStage === 0) {
                sheetNextBtn.innerText = "다음 문제 (2/2) ➔";
            } else {
                sheetNextBtn.innerText = "최종 결과 보기 🏆";
            }

            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        function handleNextStep() {
            currentStage++;
            if (currentStage < selectedQuizList.length) {
                renderCurrentQuiz();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('step-indicator').style.display = 'none';

            const finalScreen = document.getElementById('final-screen');
            finalScreen.style.display = 'flex';

            const badge = document.getElementById('final-badge');
            const title = document.getElementById('final-title');
            const scoreEl = document.getElementById('final-score');
            const desc = document.getElementById('final-desc');

            scoreEl.innerText = `총 2문제 중 ${score}개 정답!`;

            if (score === 2) {
                badge.innerText = '🎉';
                title.innerText = `완벽해요! [${activeCategoryName}] 마스터!`;
                desc.innerText = `선택하신 ${activeCategoryName} 2문제를 모두 맞히셨습니다. 시흥 역사를 아주 잘 아시네요! 👏`;
            } else if (score === 1) {
                badge.innerText = '👍';
                title.innerText = '훌륭해요! 1문제 정답!';
                desc.innerText = `${activeCategoryName} 영역에서 1문제를 맞히셨어요. 재미있는 시흥 옛이야기를 알게 되셨길 바랍니다 😊`;
            } else {
                badge.innerText = '💡';
                title.innerText = '새로운 역사 지식 습득!';
                desc.innerText = `오늘 ${activeCategoryName}에 대해 새로운 역사적 사실을 알게 되었네요! 수고하셨습니다 👏`;
            }
        }

        window.onload = function() {
            showCategoryScreen();
        };
    </script>
</body>
</html>
