<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시흥시 역사 퀵 챌린지</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f6f8;
            color: #191f28;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            overflow: hidden;
        }
        .app-container {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 680px;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header-badge {
            background: #e8f3ff;
            color: #3182f6;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .header-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: #333d4b;
        }
        .step-indicator {
            font-size: 0.85rem;
            font-weight: 700;
            color: #3182f6;
            background: #f2f4f6;
            padding: 4px 10px;
            border-radius: 12px;
        }

        .card-body {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .question-category {
            font-size: 0.85rem;
            font-weight: 700;
            color: #8b95a1;
            margin-bottom: 6px;
        }
        .question-text {
            font-size: 1.15rem;
            font-weight: 700;
            color: #191f28;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .option-btn {
            background: #f9fafb;
            border: 1px solid #e5e8eb;
            border-radius: 14px;
            padding: 14px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            text-align: left;
            color: #333d4b;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .option-btn:active {
            background: #e5e8eb;
            transform: scale(0.98);
        }

        /* 최종 결과 화면 전용 스타일 */
        .final-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 20px 0;
        }
        .final-badge {
            font-size: 3.8rem;
            margin-bottom: 16px;
        }
        .final-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #191f28;
            margin-bottom: 8px;
        }
        .final-score {
            font-size: 1.25rem;
            font-weight: 700;
            color: #3182f6;
            margin-bottom: 20px;
        }
        .final-desc {
            font-size: 0.95rem;
            color: #4e5968;
            line-height: 1.5;
            background: #f9fafb;
            padding: 20px;
            border-radius: 18px;
            width: 100%;
        }

        /* 토스 스타일 바텀시트 */
        .bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #ffffff;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            padding: 24px 20px 32px 20px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.1);
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.1, 1, 0.1, 1);
            z-index: 10;
        }
        .bottom-sheet.show {
            transform: translateY(0);
        }
        
        @keyframes bounceIn {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
        .icon-correct {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: bounceIn 0.4s ease;
        }
        .icon-wrong {
            font-size: 2.2rem;
            margin-bottom: 8px;
            display: inline-block;
            animation: shake 0.4s ease;
        }

        .sheet-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .sheet-title.correct-color { color: #2480f6; }
        .sheet-title.wrong-color { color: #f04452; }

        .sheet-desc {
            font-size: 0.92rem;
            color: #4e5968;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .next-btn {
            background: #3182f6;
            color: #ffffff;
            border: none;
            border-radius: 14px;
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }
        .next-btn:active {
            background: #1b64da;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 5;
        }
        .overlay.show {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- 상단 헤더 -->
        <div class="header" id="app-header">
            <div class="header-left">
                <span class="header-badge">시흥스탬프</span>
                <span class="header-title">우리 동네 역사 퀴즈</span>
            </div>
            <span class="step-indicator" id="step-indicator">1 / 2</span>
        </div>

        <!-- 문제 진행 화면 -->
        <div class="card-body" id="quiz-screen">
            <div id="question-category" class="question-category">📖 설화 문제</div>
            <div id="question-text" class="question-text">문제를 불러오는 중...</div>
            <div class="options-list" id="options-list"></div>
        </div>

        <!-- 최종 결과 화면 (버튼 없는 깔끔한 토스 카드 스타일) -->
        <div class="final-screen" id="final-screen">
            <div class="final-badge" id="final-badge">🏆</div>
            <div class="final-title" id="final-title">퀴즈 완료!</div>
            <div class="final-score" id="final-score">총 2문제 중 2개 정답</div>
            <div class="final-desc" id="final-desc">시흥의 역사와 설화를 잘 알고 계시네요! 멋집니다 👍</div>
        </div>

        <!-- 오버레이 및 바텀시트 -->
        <div id="overlay" class="overlay"></div>

        <div id="bottom-sheet" class="bottom-sheet">
            <div id="sheet-icon"></div>
            <div id="sheet-title" class="sheet-title"></div>
            <div id="sheet-desc" class="sheet-desc"></div>
            <button class="next-btn" id="sheet-next-btn" onclick="handleNextStep()">다음 문제 ➔</button>
        </div>
    </div>

    <script>
        const folkloreQuizzes = [
            {
                category: "📖 동네 설화 문제",
                q: "오이도의 옛 이름인 '옥귀도' 설화에서 어부가 조난당한 임금에게 바친 것은?",
                options: [
                    "1. 옥(玉)으로 만든 그릇에 담긴 시원한 물",
                    "2. 서해안에서 바로 잡은 신선한 횟감",
                    "3. 섬에서 자라난 신비한 황금 열매",
                    "4. 임금의 목숨을 구한 튼튼한 뗏목"
                ],
                answer: 0,
                explanation: "배가 표류하여 목이 마르던 임금에게 어부가 귀한 옥그릇에 물을 떠다 바치자 감격하여 '옥귀도(玉貴島)'라 부르기 시작했다고 합니다."
            },
            {
                category: "📖 동네 설화 문제",
                q: "시흥 죽율동 '생금집' 전설에서 주인공 김창관이 옥구도 우물가에서 발견한 신비한 동물은?",
                options: [
                    "1. 깃털 하나가 금으로 변하는 샛노란 닭",
                    "2. 보물을 찾아주는 영험한 흰 학",
                    "3. 황금알을 낳는 신비한 서해안 거북이",
                    "4. 소원을 들어주는 황금빛 여우"
                ],
                answer: 0,
                explanation: "샛노란 닭의 깃털이 금으로 변해 큰 부자가 되었고 기와집을 지었는데, 이 집이 바로 시흥시 향토유적 제7호 '생금집'입니다."
            }
        ];

        const placeQuizzes = [
            {
                category: "📍 지명 유래 문제",
                q: "오이도의 원래 한자 표기인 '烏耳島(오이도)'에 얽힌 역사적 진실은?",
                options: [
                    "1. 진짜로 까마귀가 많아 붙여진 이름이다.",
                    "2. '옷귀' 등 고유어 지명을 한자로 음차한 것이다.",
                    "3. 일제강점기에 일본인이 만든 이름이다.",
                    "4. 섬의 생김새가 까마귀 귀 모양과 똑같다."
                ],
                answer: 1,
                explanation: "'까마귀 귀'는 후대에 한자로 끼워 맞춘 것이며, 원래는 '오질애'·'옷귀' 등 고유어를 한자로 옮기는 과정에서 정착된 이름입니다."
            },
            {
                category: "📍 지명 유래 문제",
                q: "시흥시 정왕동의 모태가 된 '정왕산(正往山)' 지명의 뜻은?",
                options: [
                    "1. 정이 많고 왕성한 기운이 서린 산",
                    "2. 올바른(正) 공직자들이 왕래(往)하던 산",
                    "3. 정씨와 왕씨 성을 가진 사람들이 개척한 산",
                    "4. 왕이 정사를 돌보며 휴식하던 산"
                ],
                answer: 1,
                explanation: "조정에서 파견된 공직자들이 군사 시설인 봉화대로 가기 위해 이 산을 왕래할 때 '올바른 관리들이 다니는 곳'이라는 뜻에서 붙여졌습니다."
            }
        ];

        let currentStage = 0;
        let score = 0;
        let selectedQuizList = [];

        function startQuizGame() {
            currentStage = 0;
            score = 0;

            const randomFolklore = folkloreQuizzes[Math.floor(Math.random() * folkloreQuizzes.length)];
            const randomPlace = placeQuizzes[Math.floor(Math.random() * placeQuizzes.length)];
            selectedQuizList = [randomFolklore, randomPlace];

            document.getElementById('final-screen').style.display = 'none';
            document.getElementById('quiz-screen').style.display = 'flex';
            document.getElementById('app-header').style.display = 'flex';

            renderCurrentQuiz();
        }

        function renderCurrentQuiz() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            const quiz = selectedQuizList[currentStage];

            document.getElementById('step-indicator').innerText = (currentStage + 1) + " / 2";
            document.getElementById('question-category').innerText = quiz.category;
            document.getElementById('question-text').innerText = quiz.q;

            const optionsList = document.getElementById('options-list');
            optionsList.innerHTML = '';

            quiz.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(index);
                optionsList.appendChild(btn);
            });
        }

        function checkAnswer(selectedIndex) {
            const quiz = selectedQuizList[currentStage];
            const sheet = document.getElementById('bottom-sheet');
            const overlay = document.getElementById('overlay');
            const sheetIcon = document.getElementById('sheet-icon');
            const sheetTitle = document.getElementById('sheet-title');
            const sheetDesc = document.getElementById('sheet-desc');
            const sheetNextBtn = document.getElementById('sheet-next-btn');

            if (selectedIndex === quiz.answer) {
                score++;
                sheetIcon.className = 'icon-correct';
                sheetIcon.innerHTML = '⭕';
                sheetTitle.className = 'sheet-title correct-color';
                sheetTitle.innerText = '정답입니다!';
            } else {
                sheetIcon.className = 'icon-wrong';
                sheetIcon.innerHTML = '❌';
                sheetTitle.className = 'sheet-title wrong-color';
                sheetTitle.innerText = '아쉽네요, 틀렸습니다!';
            }

            sheetDesc.innerText = quiz.explanation;

            if (currentStage === 0) {
                sheetNextBtn.innerText = "다음 문제 (2/2) ➔";
            } else {
                sheetNextBtn.innerText = "최종 결과 보기 🏆";
            }

            overlay.classList.add('show');
            sheet.classList.add('show');
        }

        function handleNextStep() {
            currentStage++;
            if (currentStage < selectedQuizList.length) {
                renderCurrentQuiz();
            } else {
                showFinalResult();
            }
        }

        function showFinalResult() {
            document.getElementById('bottom-sheet').classList.remove('show');
            document.getElementById('overlay').classList.remove('show');

            document.getElementById('quiz-screen').style.display = 'none';
            document.getElementById('app-header').style.display = 'none';

            const finalScreen = document.getElementById('final-screen');
            finalScreen.style.display = 'flex';

            const badge = document.getElementById('final-badge');
            const title = document.getElementById('final-title');
            const scoreEl = document.getElementById('final-score');
            const desc = document.getElementById('final-desc');

            scoreEl.innerText = `총 2문제 중 ${score}개 정답!`;

            if (score === 2) {
                badge.innerText = '🎉';
                title.innerText = '완벽해요! 역사 박사시네요!';
                desc.innerText = '시흥의 설화와 지명 유래를 완벽하게 맞추셨습니다. 대단해요! 👏';
            } else if (score === 1) {
                badge.innerText = '👍';
                title.innerText = '아깝네요! 한 문제 정답!';
                desc.innerText = '시흥의 역사에 대해 잘 알고 계시는군요! 조금만 더 공부하면 만점이에요 😊';
            } else {
                badge.innerText = '💡';
                title.innerText = '새로운 역사 지식 습득!';
                desc.innerText = '오늘 시흥의 재미있는 옛 이야기를 새로 알게 되었네요! 수고하셨습니다 👏';
            }
        }

        window.onload = function() {
            startQuizGame();
        };
    </script>
</body>
</html>
